# Render Blueprint — deploys all three VOLTECH apps plus a shared Postgres
# database. In the Render dashboard: New + -> Blueprint -> select this repo.
#
# Free-tier notes (the defaults below):
#   - Free web services spin down after 15 min idle and take ~1 min to wake
#     on the next request (customer/seller/admin are three separate free
#     services, so an idle admin dashboard will cold-start independently).
#   - The free Postgres database expires 30 days after creation (14-day
#     grace period after that) and is then deleted. Fine for a first deploy
#     / demo; switch `plan: free` to e.g. `basic-256mb` under `databases`
#     before this holds anything you can't afford to lose.
#   - Change any `plan: free` below to `starter` or higher to remove the
#     spin-down behavior for a given service.
#
# `npm ci --include=dev` (not plain `npm ci`) is required: Render injects
# each service's envVars — including NODE_ENV=production below — into the
# build step too, and npm skips devDependencies under NODE_ENV=production
# unless told otherwise. tailwindcss, @tailwindcss/postcss, typescript, and
# the @types/* packages all live in devDependencies and are needed to run
# `next build` itself, not just for local dev.
#
# AUTH_URL is set explicitly per service (rather than relying on `trustHost`
# alone) because in practice, on Render, the request Host header the app
# sees is the internal `localhost:$PORT` binding, not the public domain —
# Auth.js's own redirect/callbackUrl construction picked that up and
# produced broken links like `/login?callbackUrl=https://localhost:10000/...`
# until this was set. If you rename a service, update its AUTH_URL to match
# (it must be the service's own onrender.com URL, or your custom domain).

databases:
  - name: voltech-postgres
    plan: free
    databaseName: voltech
    user: voltech

services:
  - type: web
    name: voltech-customer
    runtime: node
    plan: free
    region: oregon
    buildCommand: >-
      npm ci --include=dev &&
      npm run db:generate &&
      npm run db:migrate:deploy &&
      npm run build:customer
    startCommand: npm run start --workspace=@voltech/customer
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voltech-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        value: https://voltech-customer.onrender.com
      - key: NEXT_PUBLIC_SELLER_URL
        value: https://voltech-seller.onrender.com

  - type: web
    name: voltech-seller
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build:seller
    startCommand: npm run start --workspace=@voltech/seller
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voltech-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        value: https://voltech-seller.onrender.com

  - type: web
    name: voltech-admin
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build:admin
    startCommand: npm run start --workspace=@voltech/admin
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voltech-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        value: https://voltech-admin.onrender.com
