# Render Blueprint — deploys all three VOLTECH apps plus a shared Postgres
# database. In the Render dashboard: New + -> Blueprint -> select this repo.
#
# Free-tier notes (the defaults below):
#   - Free web services spin down after 15 min idle and take ~1 min to wake
#     on the next request (customer/seller/admin are three separate free
#     services, so an idle admin dashboard will cold-start independently).
#   - The free Postgres database expires 30 days after creation (14-day
#     grace period after that) and is then deleted. Fine for a first deploy
#     / demo; switch `plan: free` to e.g. `basic-256mb` under `databases`
#     before this holds anything you can't afford to lose.
#   - Change any `plan: free` below to `starter` or higher to remove the
#     spin-down behavior for a given service.
#
# `npm ci --include=dev` (not plain `npm ci`) is required: Render injects
# each service's envVars — including NODE_ENV=production below — into the
# build step too, and npm skips devDependencies under NODE_ENV=production
# unless told otherwise. tailwindcss, @tailwindcss/postcss, typescript, and
# the @types/* packages all live in devDependencies and are needed to run
# `next build` itself, not just for local dev.
#
# Auth is Firebase Auth (not this file's job to configure Firebase itself —
# see README's "Firebase setup" section for the Console steps). Three kinds
# of Firebase env var below:
#   - NEXT_PUBLIC_FIREBASE_* — the client config, not a secret, safe as a
#     plain `value:` (Firebase enforces access via Security Rules /
#     Authorized domains, not by hiding this object).
#   - FIREBASE_SERVICE_ACCOUNT_BASE64 (recommended) — the whole service-
#     account JSON, base64-encoded, as one env var. `sync: false` — set it
#     directly in the Render dashboard on all three services, from
#     Firebase Console > Project Settings > Service Accounts > Generate
#     new private key, then locally:
#       PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("service-account.json"))
#       bash:       base64 -w0 service-account.json
#     A single-line base64 value is easy to paste correctly; a multiline
#     PEM private key pasted directly into a dashboard text box is not —
#     it's very easy to accidentally drop the BEGIN/END marker lines.
#   - FIREBASE_PROJECT_ID / FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY —
#     the same credential as three separate vars instead, used only if
#     FIREBASE_SERVICE_ACCOUNT_BASE64 isn't set. Never put the actual
#     values in this file.

databases:
  - name: voltech-postgres
    plan: free
    databaseName: voltech
    user: voltech

services:
  - type: web
    name: voltech-customer
    runtime: node
    plan: free
    region: oregon
    buildCommand: >-
      npm ci --include=dev &&
      npm run db:generate &&
      npm run db:migrate:deploy &&
      npm run build:customer
    startCommand: npm run start --workspace=@voltech/customer
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voltech-postgres
          property: connectionString
      - key: NEXT_PUBLIC_SELLER_URL
        value: https://voltech-seller.onrender.com
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyCpabW74dXyP2FwTAakSm1PbIjlTqbE3ds
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: voltech-148ca.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: voltech-148ca
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: voltech-148ca.firebasestorage.app
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "765763252003"
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: "1:765763252003:web:7953a599288f470e796696"
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

  - type: web
    name: voltech-seller
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build:seller
    startCommand: npm run start --workspace=@voltech/seller
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voltech-postgres
          property: connectionString
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyCpabW74dXyP2FwTAakSm1PbIjlTqbE3ds
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: voltech-148ca.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: voltech-148ca
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: voltech-148ca.firebasestorage.app
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "765763252003"
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: "1:765763252003:web:7953a599288f470e796696"
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

  - type: web
    name: voltech-admin
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build:admin
    startCommand: npm run start --workspace=@voltech/admin
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voltech-postgres
          property: connectionString
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyCpabW74dXyP2FwTAakSm1PbIjlTqbE3ds
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: voltech-148ca.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: voltech-148ca
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: voltech-148ca.firebasestorage.app
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "765763252003"
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: "1:765763252003:web:7953a599288f470e796696"
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
